<!--
  Milo — placeholder mascot.
  Replace this file with the real Milo artwork (SVG preferred, or swap the
  <img> in index.html for a PNG). Kept intentionally simple and on-brand.
-->
<svg class="milo" viewBox="0 0 240 260" role="img" aria-label="Milo, the Azulize mascot" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="miloBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FC5EE"/>
      <stop offset="1" stop-color="#4A9BD4"/>
    </linearGradient>
    <radialGradient id="miloCheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F7A8C0"/>
      <stop offset="1" stop-color="#F7A8C0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="120" cy="238" rx="72" ry="14" fill="#123F92" opacity="0.12"/>

  <!-- antenna -->
  <line x1="120" y1="40" x2="120" y2="14" stroke="#5B6BB8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="12" r="9" fill="#F0B24C"/>

  <!-- body -->
  <rect x="34" y="40" width="172" height="176" rx="56" fill="url(#miloBody)"/>
  <rect x="34" y="40" width="172" height="176" rx="56" fill="none" stroke="#123F92" stroke-opacity="0.08" stroke-width="4"/>

  <!-- face plate -->
  <rect x="60" y="74" width="120" height="96" rx="40" fill="#EAF6FD"/>

  <!-- eyes -->
  <circle cx="98" cy="118" r="13" fill="#123F92"/>
  <circle cx="142" cy="118" r="13" fill="#123F92"/>
  <circle cx="102" cy="114" r="4.5" fill="#fff"/>
  <circle cx="146" cy="114" r="4.5" fill="#fff"/>

  <!-- cheeks -->
  <circle cx="78" cy="140" r="14" fill="url(#miloCheek)"/>
  <circle cx="162" cy="140" r="14" fill="url(#miloCheek)"/>

  <!-- smile -->
  <path d="M100 144 Q120 162 140 144" fill="none" stroke="#123F92" stroke-width="6" stroke-linecap="round"/>

  <!-- arms -->
  <path d="M34 130 Q10 140 16 168" fill="none" stroke="#4A9BD4" stroke-width="16" stroke-linecap="round"/>
  <path d="M206 130 Q230 118 226 92" fill="none" stroke="#4A9BD4" stroke-width="16" stroke-linecap="round"/>

  <!-- feet -->
  <rect x="70" y="208" width="34" height="20" rx="10" fill="#5B6BB8"/>
  <rect x="136" y="208" width="34" height="20" rx="10" fill="#5B6BB8"/>
</svg>
