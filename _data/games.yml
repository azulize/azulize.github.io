# =============================================================================
#  KidsStudio catalog — 18 apps, one mechanic per app.
#
#  tier:         groups the app on the homepage (see _data/tiers.yml)
#  ages:         parent-facing age range, shown as a badge
#  appstore_url: leave "" until the app is live, then paste the App Store link.
#                When set, the card shows a real "App Store" button.
#  gradient:     [from, to] — colors for the app tile.
#
#  To add or edit a title, copy a block and fill it in — the homepage grid and
#  the legal pages' "covered apps" list update automatically.
# =============================================================================

